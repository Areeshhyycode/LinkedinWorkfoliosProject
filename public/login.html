<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — LinkedIn Outreach</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-bg">
  <form class="login-card" id="form">
    <div class="logo">in</div>
    <h1>LinkedIn Outreach</h1>
    <p class="muted">Apna password daal ke login karo</p>
    <input type="password" id="password" placeholder="Password" autofocus />
    <button type="submit">Login</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const form = document.getElementById("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (r.ok) location.href = "/";
      else document.getElementById("err").textContent = "Galat password — dobara try karo";
    });
  </script>
</body>
</html>
